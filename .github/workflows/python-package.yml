name: Build Flet APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Flet and Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet pydantic google-genai httpx

      - name: Build APK with Flet
        run: |
          flet build apk --project "Quang AI Studio"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quang-AI-Studio-APK
          path: build/apk/app-release.apk
